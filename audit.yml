---
# audit.yml
# Extrait les policies, leurs statistiques d'usage (hit_count) et les objets
# adresses/groupes de chaque FortiGate, puis lance l'analyse Python qui génère
# un rapport complet + un playbook de nettoyage à valider manuellement.

- name: Audit et extraction des policies FortiGate
  hosts: fortigate_1
  gather_facts: false
  connection: local

  vars:
    reports_dir: "./reports"
    raw_dir: "./reports/raw"

  tasks:

    - name: Créer les dossiers de sortie
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - "{{ raw_dir }}"
        - "./generated"
      delegate_to: localhost
      run_once: true

    # ------------------------------------------------------------------
    # 1. Définitions complètes des policies (source de vérité config)
    # ------------------------------------------------------------------
    - name: Récupérer les policies (cmdb)
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}/api/v2/cmdb/firewall/policy"
        method: GET
        headers:
          Authorization: "Bearer {{ fortios_access_token }}"
        validate_certs: false
        status_code: 200
        return_content: true
        timeout: 60
      register: policies_cmdb
      delegate_to: localhost
      no_log: true

    # ------------------------------------------------------------------
    # 2. Statistiques d'utilisation (hit_count, last_used, bytes...)
    # ------------------------------------------------------------------
    - name: Récupérer les statistiques d'usage des policies (monitor)
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}/api/v2/monitor/firewall/policy"
        method: GET
        headers:
          Authorization: "Bearer {{ fortios_access_token }}"
        validate_certs: false
        status_code: 200
        return_content: true
        timeout: 60
      register: policies_monitor
      delegate_to: localhost
      no_log: true

    # ------------------------------------------------------------------
    # 3. Objets adresses
    # ------------------------------------------------------------------
    - name: Récupérer les objets adresses
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}/api/v2/cmdb/firewall/address"
        method: GET
        headers:
          Authorization: "Bearer {{ fortios_access_token }}"
        validate_certs: false
        status_code: 200
        return_content: true
        timeout: 60
      register: addresses_cmdb
      delegate_to: localhost
      no_log: true

    # ------------------------------------------------------------------
    # 4. Groupes d'adresses
    # ------------------------------------------------------------------
    - name: Récupérer les groupes d'adresses
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}/api/v2/cmdb/firewall/addrgrp"
        method: GET
        headers:
          Authorization: "Bearer {{ fortios_access_token }}"
        validate_certs: false
        status_code: 200
        return_content: true
        timeout: 60
      register: addrgrp_cmdb
      delegate_to: localhost
      no_log: true

    # ------------------------------------------------------------------
    # 5. Sauvegarde des extractions brutes (une par hôte)
    # ------------------------------------------------------------------
    - name: Sauvegarder les extractions brutes en JSON
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ raw_dir }}/{{ inventory_hostname }}_{{ item.name }}.json"
        mode: '0600'
      loop:
        - { content: "{{ policies_cmdb.content }}", name: "policies" }
        - { content: "{{ policies_monitor.content }}", name: "policies_stats" }
        - { content: "{{ addresses_cmdb.content }}", name: "addresses" }
        - { content: "{{ addrgrp_cmdb.content }}", name: "addrgroups" }
      delegate_to: localhost
      no_log: true

    # ------------------------------------------------------------------
    # 6. Lancer l'analyse Python : rapport + playbook de nettoyage
    # ------------------------------------------------------------------
    - name: Analyser les policies et générer le rapport + le playbook de nettoyage
      ansible.builtin.command:
        cmd: >
          python3 ./scripts/analyze_policies.py
          --hostname {{ inventory_hostname }}
          --policies {{ raw_dir }}/{{ inventory_hostname }}_policies.json
          --policies-stats {{ raw_dir }}/{{ inventory_hostname }}_policies_stats.json
          --addresses {{ raw_dir }}/{{ inventory_hostname }}_addresses.json
          --addrgroups {{ raw_dir }}/{{ inventory_hostname }}_addrgroups.json
          --report-dir {{ reports_dir }}
          --cleanup-dir ./generated
      delegate_to: localhost
      changed_when: true
      register: analysis_result

    - name: Afficher le résumé de l'analyse
      ansible.builtin.debug:
        msg: "{{ analysis_result.stdout_lines }}"