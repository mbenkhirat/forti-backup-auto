name: FortiGate GitOps Backup 1108

on:
  schedule:
    # Exécution toutes les 5 minutes (pour tests)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permet de conserver le déclenchement manuel

jobs:
  run-backup:
    runs-on: self-hosted   # Exécution sur votre VM Ubuntu locale

    permissions:
      contents: write

    steps:      
      - name: Récupérer le code du dépôt (Checkout)
        uses: actions/checkout@v4

      - name: S'assurer que la collection Fortinet est présente
        run: |
          export PATH=$PATH:$HOME/.local/bin
          ansible-galaxy collection install fortinet.fortios

      - name: Exécuter le Playbook de Sauvegarde
        env:
          FORTIOS_ACCESS_TOKEN: ${{ secrets.FORTIOS_ACCESS_TOKEN }}
        run: |
          export PATH=$PATH:$HOME/.local/bin
          ansible-playbook -i inventory.yml backup_and_clean.yml -e "fortios_access_token=${{ secrets.FORTIOS_ACCESS_TOKEN }}"

      - name: Commit et Push des fichiers de sauvegarde sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f backups/
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(backup): auto-backup FortiGate local - $(date +'%Y-%m-%d')"
            git push
          else
            echo "Aucune modification détectée dans la configuration."
          fi
