name: FortiGate Multi-Device Backup Runner

on:
  schedule:
    # Once a day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-backup:
    runs-on: self-hosted

    steps:
      - name: Check out the repository code
        uses: actions/checkout@v4

      - name: Ensure the Fortinet collection is installed
        run: |
          export PATH=$PATH:$HOME/.local/bin
          ansible-galaxy collection install fortinet.fortios

      - name: Run the multi-FortiGate backup playbook
        env:
          FORTIOS_TOKENS_JSON: ${{ secrets.FORTIOS_TOKENS_JSON }}
        run: |
          export PATH=$PATH:$HOME/.local/bin
          ansible-playbook -i inventory.yml backup_and_clean.yml

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.ALERT_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"text": "❌ FortiGate backup (multi-device) failed on runner '"${{ runner.name }}"' — see Actions: '"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'"}' \
            || echo "Webhook not configured or unavailable, notification skipped."