name: FortiGate GitOps Backup

on:
  schedule:
    # Une fois par jour à 02h00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-backup:
    runs-on: self-hosted

    permissions:
      contents: write

    steps:
      - name: Récupérer le code du dépôt (Checkout)
        uses: actions/checkout@v4

      - name: S'assurer que la collection Fortinet est présente
        run: |
          export PATH=$PATH:$HOME/.local/bin
          ansible-galaxy collection install fortinet.fortios

      - name: Exécuter le Playbook de Sauvegarde
        env:
          FORTIOS_ACCESS_TOKEN: ${{ secrets.FORTIOS_ACCESS_TOKEN }}
        run: |
          export PATH=$PATH:$HOME/.local/bin
          ansible-playbook -i inventory.yml backup_and_clean.yml

      - name: Commit et Push des fichiers de sauvegarde sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f backups/
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(backup): auto-backup FortiGate local - $(date +'%Y-%m-%d')"
            git push
          else
            echo "Aucune modification détectée dans la configuration."
          fi

      - name: Notifier en cas d'échec
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.ALERT_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"text": "❌ FortiGate GitOps Backup a échoué sur le runner '"${{ runner.name }}"' — voir Actions: '"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'"}' \
            || echo "Webhook non configuré ou indisponible, notification ignorée."