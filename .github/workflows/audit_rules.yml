name: FortiGate Policy Audit & Cleanup

on:
  # Exécution programmée tous les 1ers du mois à 03h00 UTC
  schedule:
    - cron: '0 3 1 * *'
  # Possibilité de déclencher manuellement le workflow depuis GitHub
  workflow_dispatch:

jobs:
  audit-policies:
    name: Audit & Purge des Règles FortiGate
    runs-on: self-hosted

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Python et Ansible
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Exécuter le Playbook d'Audit et Nettoyage
        env:
          FORTIOS_TOKENS_JSON: ${{ secrets.FORTIOS_TOKENS_JSON }}
        run: |
          export PATH=$PATH:$HOME/.local/bin
          ansible-playbook -i inventory.ini audit_policy_cleanup.yml

      - name: Archiver les rapports d'audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortigate-audit-reports-${{ github.run_id }}
          path: /home/mbenkhirat/ansible-projects/fortigate_audit_reports/
          retention-days: 90