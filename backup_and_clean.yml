---
- name: Sauvegarde FortiGate Multi-équipements et Rétention
  hosts: fortigates
  gather_facts: false
  vars:
    local_backup_dir: "/home/mbenkhirat/ansible-projects/fortigate_local_backups"
    reports_dir: "/home/mbenkhirat/ansible-projects/fortigate_reports"
    retention_days: 90  # Rétention de 3 mois (~90 jours)

  tasks:
    - name: Récupérer la date système locale
      ansible.builtin.setup:
        filter:
          - "ansible_date_time"
      delegate_to: localhost

    - name: S'assurer que le dossier de sauvegarde locale existe
      ansible.builtin.file:
        path: "{{ local_backup_dir }}"
        state: directory
        mode: '0700'
      delegate_to: localhost

    - name: S'assurer que le dossier des rapports existe
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Télécharger la configuration via API FortiOS (POST)
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}/api/v2/monitor/system/config/backup?scope=global"
        method: POST
        headers:
          Authorization: "Bearer {{ fortios_access_token }}"
        body_format: json
        validate_certs: false
        status_code: 200
        return_content: true
        timeout: 30
      register: config_backup_raw
      delegate_to: localhost
      ignore_errors: true  # Empêche le blocage global si un équipement échoue
      no_log: true

    - name: Définir l'état du backup (Succès)
      ansible.builtin.set_fact:
        backup_status: "✅ Réussi"
      when: config_backup_raw is success

    - name: Définir l'état du backup (Échec)
      ansible.builtin.set_fact:
        backup_status: "❌ Échoué"
      when: config_backup_raw is failed

    - name: Définir le nom de fichier de sauvegarde locale (horodaté par hôte)
      ansible.builtin.set_fact:
        local_backup_filename: "{{ inventory_hostname }}_{{ ansible_facts['date_time']['date'] }}_{{ ansible_facts['date_time']['time'] | replace(':','') }}.conf"
      when: config_backup_raw is success

    - name: Écrire la sauvegarde dans le dossier local
      ansible.builtin.copy:
        content: "{{ config_backup_raw.content }}"
        dest: "{{ local_backup_dir }}/{{ local_backup_filename }}"
        mode: '0600'
      delegate_to: localhost
      when: config_backup_raw is success
      no_log: true

    # --- Tâches de Rétention / Nettoyage globale ---

    - name: Rechercher les sauvegardes locales de plus de 90 jours
      ansible.builtin.find:
        paths: "{{ local_backup_dir }}"
        patterns: "*.conf"
        age: "{{ retention_days }}d"
        file_type: file
      register: old_backups
      delegate_to: localhost
      run_once: true

    - name: Supprimer les sauvegardes obsolètes
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_backups.files }}"
      when: old_backups.matched > 0
      delegate_to: localhost
      run_once: true

    - name: Afficher le bilan du nettoyage
      ansible.builtin.debug:
        msg: "{{ old_backups.matched }} fichier(s) de sauvegarde de plus de {{ retention_days }} jours supprimé(s)."
      delegate_to: localhost
      run_once: true

    # --- Rapport Final d'exécution ---

    - name: Construire le contenu du rapport
      ansible.builtin.set_fact:
        report_content: |
          ==================================================
                   RAPPORT DE SAUVEGARDE FORTIGATE          
                   Date: {{ ansible_facts['date_time']['date'] }} {{ ansible_facts['date_time']['time'] }}
          ==================================================
          {% for host in ansible_play_hosts %}
            • {{ "%-25s" | format(host) }} : {{ hostvars[host]['backup_status'] | default('❓ Inconnu') }}
          {% endfor %}
          ==================================================
      delegate_to: localhost
      run_once: true

    - name: Afficher le rapport dans les logs
      ansible.builtin.debug:
        msg: "{{ report_content }}"
      delegate_to: localhost
      run_once: true

    - name: Enregistrer le rapport dans un fichier horodaté
      ansible.builtin.copy:
        content: "{{ report_content }}"
        dest: "{{ reports_dir }}/rapport_sauvegarde_{{ ansible_facts['date_time']['date'] }}_{{ ansible_facts['date_time']['time'] | replace(':','') }}.txt"
        mode: '0644'
      delegate_to: localhost
      run_once: true