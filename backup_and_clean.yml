---
- name: GitOps - Sauvegarde FortiGate et Rétention 02
  hosts: fortigate_1
  gather_facts: false
  connection: local

  vars:
    backup_dir: "./backups"
    retention_days: 7
    fortios_token: "{{ fortios_access_token | default(lookup('env', 'FORTIOS_ACCESS_TOKEN')) }}"

  tasks:
    # 1. Récupérer la date locale
    - name: Récupérer la date système locale
      ansible.builtin.setup:
        filter:
          - "ansible_date_time"
      delegate_to: localhost
      run_once: true

    - name: S'assurer que le dossier de sauvegarde existe
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    # 2. Télécharger la configuration via FortiOS Monitor API
    - name: Télécharger la configuration via FortiOS Monitor API
      fortinet.fortios.fortios_monitor_fact:
        host: "{{ ansible_host }}"
        vdom: "{{ vdom | default('root') }}"
        access_token: "{{ fortios_token }}"
        enable_https: true
        ssl_verify: false
        selector: "system_config_backup"
        params:
          scope: "global"
      register: config_backup_raw

    # 3. Écrire le fichier .conf
    - name: Écrire le fichier de configuration .conf
      ansible.builtin.copy:
        content: "{{ config_backup_raw.meta.raw }}"
        dest: "{{ backup_dir }}/{{ inventory_hostname }}_{{ ansible_date_time.date }}.conf"
        mode: '0644'

    # 4. Nettoyer les fichiers de plus de X jours
    - name: Rechercher les sauvegardes de plus de {{ retention_days }} jours
      ansible.builtin.find:
        paths: "{{ backup_dir }}"
        patterns: "*.conf"
        age: "{{ retention_days }}d"
      register: old_backups

    - name: Supprimer les sauvegardes obsolètes
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_backups.files }}"
      when: old_backups.matched > 0