---
- name: Sauvegarde FortiGate Multi-équipements et Rétention
  hosts: fortigates
  gather_facts: false
  vars:
    local_backup_dir: "/home/mbenkhirat/ansible-projects/fortigate_local_backups"
    retention_days: 90  # Rétention de 3 mois (~90 jours)

  tasks:
    - name: Récupérer la date système locale
      ansible.builtin.setup:
        filter:
          - "ansible_date_time"
      delegate_to: localhost

    - name: S'assurer que le dossier de sauvegarde locale existe
      ansible.builtin.file:
        path: "{{ local_backup_dir }}"
        state: directory
        mode: '0700'
      delegate_to: localhost

    # --- Bloc de Sauvegarde avec Gestion des Échecs ---
    - name: Exécuter la sauvegarde FortiGate
      block:
        - name: Télécharger la configuration via API FortiOS (POST)
          ansible.builtin.uri:
            url: "https://{{ ansible_host }}/api/v2/monitor/system/config/backup?scope=global"
            method: POST
            headers:
              Authorization: "Bearer {{ (lookup('env', 'FORTIOS_TOKENS_JSON') | from_json)[fortios_token_key] }}"
            body_format: json
            validate_certs: false
            status_code: 200
            return_content: true
            timeout: 30
          register: config_backup_raw
          delegate_to: localhost
          no_log: true

        - name: Définir le nom de fichier de sauvegarde locale
          ansible.builtin.set_fact:
            local_backup_filename: "{{ inventory_hostname }}_{{ ansible_date_time.date }}_{{ ansible_date_time.time | replace(':','') }}.conf"

        - name: Écrire la sauvegarde dans le dossier local
          ansible.builtin.copy:
            content: "{{ config_backup_raw.content }}"
            dest: "{{ local_backup_dir }}/{{ local_backup_filename }}"
            mode: '0600'
          delegate_to: localhost
          no_log: true

        - name: Enregistrer le succès de la sauvegarde
          ansible.builtin.set_fact:
            backup_status: "SUCCESS"

      rescue:
        - name: Enregistrer l'échec de la sauvegarde
          ansible.builtin.set_fact:
            backup_status: "FAILED"

    # --- Tâches de Rétention / Nettoyage (exécutées une seule fois) ---
    - name: Rechercher les sauvegardes locales de plus de 90 jours
      ansible.builtin.find:
        paths: "{{ local_backup_dir }}"
        patterns: "*.conf"
        age: "{{ retention_days }}d"
        file_type: file
      register: old_backups
      delegate_to: localhost
      run_once: true

    - name: Supprimer les sauvegardes obsolètes
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_backups.files }}"
      when: old_backups.matched > 0
      delegate_to: localhost
      run_once: true

    # --- Rapport de Fin d'Exécution ---
    - name: Générer le rapport global des sauvegardes
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "       RAPPORT DE SAUVEGARDE FORTIGATE    "
          - "=========================================="
          - "✅ SUCCÈS : {{ ansible_play_hosts | selectattr('backup_status', 'defined') | selectattr('backup_status', 'equalto', 'SUCCESS') | list }}"
          - "❌ ÉCHECS : {{ ansible_play_hosts | selectattr('backup_status', 'defined') | selectattr('backup_status', 'equalto', 'FAILED') | list }}"
          - "🧹 Nettoyage : {{ old_backups.matched | default(0) }} fichier(s) de plus de {{ retention_days }} jours supprimé(s)."
          - "=========================================="
      delegate_to: localhost
      run_once: true