all:
  children:
    fortigates:
      hosts:
        fortigate_site_kenitra:
          ansible_host: "192.168.239.130"
          vdom: "root"
          fortios_access_token: "{{ (lookup('env', 'FORTIOS_TOKENS_JSON') | from_json)['FORTIOS_TOKEN_SITE_KEN'] }}"

        fortigate_site_rabat:
          ansible_host: "192.168.239.131"
          vdom: "root"
          fortios_access_token: "{{ (lookup('env', 'FORTIOS_TOKENS_JSON') | from_json)['FORTIOS_TOKEN_SITE_RBT'] }}"

        fortigate_datacenter:
          ansible_host: "10.0.10.1"
          vdom: "root"
          fortios_access_token: "{{ (lookup('env', 'FORTIOS_TOKENS_JSON') | from_json)['FORTIOS_TOKEN_DC'] }}"

      vars:
        ansible_network_os: fortinet.fortios.fortios
        ansible_connection: httpapi
        ansible_httpapi_use_ssl: true
        ansible_httpapi_validate_certs: false
        ansible_httpapi_port: 443