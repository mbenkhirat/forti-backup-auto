---
- name: Automatisation de la création d'objets et de politiques sur FortiGate
  hosts: fortigate_1
  collections:
    - fortinet.fortios
  gather_facts: false

  # Transmet le token automatiquement à TOUS les modules de la collection Fortinet
  #module_defaults:
    #group/fortinet.fortios.fortios:
      #access_token: "{{ fortios_access_token }}"
      #vdom: "{{ vdom }}"

  tasks:
    # 1. Récupération de toutes les politiques de sécurité
    - name: Récupérer les politiques de sécurité existantes
      fortios_configuration_fact:
        selector: "firewall_policy"
      register: policy_facts

    # 2. Identification des doublons (Même Src et Même Dst)
    - name: Analyser les règles pour isoler les ID à supprimer
      set_fact:
        duplicates_analysis: >-
          {%- set results = {} -%}
          {%- for policy in policy_facts.meta.results -%}
            {%- set src_list = policy.srcaddr | map(attribute='name') | sort | join(',') -%}
            {%- set dst_list = policy.dstaddr | map(attribute='name') | sort | join(',') -%}
            {%- set key = src_list ~ '|' ~ dst_list -%}
            
            {%- if key in results -%}
              {%- set _ = results[key].append(policy) -%}
            {%- else -%}
              {%- set _ = results.update({key: [policy]}) -%}
            {%- endif -%}
          {%- endfor -%}
          
          {%- set to_delete = [] -%}
          {%- set report = [] -%}
          
          {%- for key, policies in results.items() if policies | length > 1 -%}
            {# Tri par ID pour garder la première règle #}
            {%- set sorted_policies = policies | sort(attribute='policyid') -%}
            {%- set keep_policy = sorted_policies[0].policyid -%}
            {%- set delete_policies = sorted_policies[1:] | map(attribute='policyid') | list -%}
            
            {%- set _ = to_delete.extend(delete_policies) -%}
            {%- set _ = report.append({
                'source': key.split('|')[0],
                'destination': key.split('|')[1],
                'kept_id': keep_policy,
                'deleted_ids': delete_policies
            }) -%}
          {%- endfor -%}
          
          {{ {'report': report, 'to_delete_ids': to_delete} }}

    # 3. Rapport d'analyse avant suppression
    - name: Afficher le bilan de la consolidation
      debug:
        msg: |
          Détail des actions :
          {% for item in duplicates_analysis.report %}
          - Pour (Src: {{ item.source }} -> Dst: {{ item.destination }}) :
            * Règle conservée : ID {{ item.kept_id }}
            * Règles à SUPPRIMER : {{ item.deleted_ids }}
          {% endfor %}
          {% if duplicates_analysis.to_delete_ids | length == 0 %}
          Aucune règle dupliquée à supprimer !
          {% endif %}

    # 4. Suppression des règles secondaires (dupliquées)
    - name: Supprimer les règles dupliquées (conserve la première)
      fortios_firewall_policy:
        state: "absent"
        firewall_policy:
          policyid: "{{ item }}"
      loop: "{{ duplicates_analysis.to_delete_ids }}"
      when: duplicates_analysis.to_delete_ids | length > 0